    description: "Original production model of the Mercedes-Benz EQS (V297), a battery electric full-size luxury liftback car. Features the Mercedes-Benz EVA platform (MEA) with a drag coefficient as low as 0.20, making it the most aerodynamic production car at its introduction. Available in multiple variants including EQS 350, EQS 450+, EQS 450 4MATIC, EQS 500 4MATIC, EQS 580 4MATIC, and AMG EQS 53 4MATIC+."
